<!-- ⚠️ 只展示關鍵修改區塊（已幫你整合進原程式） -->
<script>

// --- 初始化函數 ---
function init() {

    ...

    // ===== Reflex (已升級版本) =====
    const rBox = document.getElementById('reflex-box');
    const refOpts = ["mute", "-", "+", "++", "+++", "++++"]
        .map(v => `<option value="${v}" ${v=='++'?'selected':''}>${v}</option>`).join('');

    [
        "Biceps (C5/6)",
        "Triceps (C7)",
        "Brachioradialis (C5/6)",
        "Knee (L4)",
        "Ankle (S1)"
    ].forEach(it => {
        rBox.innerHTML += `
        <div class="mp-row">
            <span>${it}</span>
            <div>
                R:<select class="ref-r" onchange="autoUpdate()">${refOpts}</select>
                L:<select class="ref-l" onchange="autoUpdate()">${refOpts}</select>
            </div>
        </div>`;
    });

    const pBox = document.getElementById('patho-reflex-box');
    const pathoOpts = ["-", "+"]
        .map(v => `<option value="${v}" ${v=='-'?'selected':''}>${v}</option>`).join('');

    [
        "Babinski",
        "Hoffman",
        "Snouting",
        "Rooting",
        "Palmo-mental"
    ].forEach(it => {
        pBox.innerHTML += `
        <div class="mp-row">
            <span>${it}</span>
            <div>
                R:<select class="patho-r" onchange="autoUpdate()">${pathoOpts}</select>
                L:<select class="patho-l" onchange="autoUpdate()">${pathoOpts}</select>
            </div>
        </div>`;
    });

    // Grasping（單一）
    pBox.innerHTML += `
    <div class="mp-row">
        <span>Grasping</span>
        <div>
            <select class="patho-g" onchange="autoUpdate()">${pathoOpts}</select>
        </div>
    </div>`;

    ...

    autoUpdate();
}

// --- generateText ---
function generateText() {

    ...

    const refR = document.querySelectorAll('.ref-r'),
          refL = document.querySelectorAll('.ref-l');
    const getRef = (i) => `${refR[i].value}/${refL[i].value}`;

    const pathoR = document.querySelectorAll('.patho-r'),
          pathoL = document.querySelectorAll('.patho-l');
    const getPatho = (i) => `${pathoR[i].value}/${pathoL[i].value}`;

    const grasping = document.querySelector('.patho-g')?.value || "-";

    ...

    const reflexText = `
DTR:
Biceps ${getRef(0)}, 
Triceps ${getRef(1)}, 
Brachioradialis ${getRef(2)}, 
Knee ${getRef(3)}, 
Ankle ${getRef(4)}

Pathological reflex:
Babinski ${getPatho(0)}, 
Hoffman ${getPatho(1)}, 
Snouting ${getPatho(2)}, 
Rooting ${getPatho(3)}, 
Palmo-mental ${getPatho(4)}, 
Grasping ${grasping}
`;

    ...

    document.getElementById('export-area').value = `
${gcsNoteLine}

...

${reflexText}

...
`;

}

</script>
