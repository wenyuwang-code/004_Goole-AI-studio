<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neuro Exam Tool</title>
<style>
body { font-family: Arial; padding: 20px; }
.mp-row { display:flex; justify-content:space-between; margin:6px 0; }
textarea { width:100%; height:220px; margin-top:20px; }
</style>
</head>

<body>

<h2>DTR & Reflexes (R/L)</h2>

<div id="reflex-box"></div>

<h3>Pathological Reflex</h3>
<div id="patho-reflex-box"></div>

<textarea id="export-area"></textarea>

<script>

// ===== init =====
function init(){

    const rBox = document.getElementById('reflex-box');
    const refOpts = ["mute", "-", "+", "++", "+++", "++++"]
        .map(v => `<option value="${v}" ${v=='++'?'selected':''}>${v}</option>`).join('');

    // ===== DTR =====
    [
        "Biceps (C5/6)",
        "Triceps (C7)",
        "Brachioradialis (C5/6)",
        "Knee (L4)",
        "Ankle (S1)"
    ].forEach(it => {
        rBox.innerHTML += `
        <div class="mp-row">
            <span>${it}</span>
            <div>
                R:<select class="ref-r" onchange="autoUpdate()">${refOpts}</select>
                L:<select class="ref-l" onchange="autoUpdate()">${refOpts}</select>
            </div>
        </div>`;
    });


    const pBox = document.getElementById('patho-reflex-box');
    const pathoOpts = ["-", "+"]
        .map(v => `<option value="${v}" ${v=='-'?'selected':''}>${v}</option>`).join('');

    // ===== Pathological reflex =====
    [
        "Babinski",
        "Hoffman",
        "Snouting",
        "Rooting",
        "Palmo-mental"
    ].forEach(it => {
        pBox.innerHTML += `
        <div class="mp-row">
            <span>${it}</span>
            <div>
                R:<select class="patho-r" onchange="autoUpdate()">${pathoOpts}</select>
                L:<select class="patho-l" onchange="autoUpdate()">${pathoOpts}</select>
            </div>
        </div>`;
    });

    // ===== Grasping（單一）=====
    pBox.innerHTML += `
    <div class="mp-row">
        <span>Grasping</span>
        <div>
            <select class="patho-g" onchange="autoUpdate()">${pathoOpts}</select>
        </div>
    </div>`;

    autoUpdate();
}


// ===== auto update =====
function autoUpdate(){
    generateText();
}


// ===== generate text =====
function generateText(){

    const refR = document.querySelectorAll('.ref-r'),
          refL = document.querySelectorAll('.ref-l');

    const getRef = (i) => `${refR[i].value}/${refL[i].value}`;

    const pathoR = document.querySelectorAll('.patho-r'),
          pathoL = document.querySelectorAll('.patho-l');

    const getPatho = (i) => `${pathoR[i].value}/${pathoL[i].value}`;

    const grasping = document.querySelector('.patho-g')?.value || "-";


    const text = `
DTR:
Biceps ${getRef(0)}
Triceps ${getRef(1)}
Brachioradialis ${getRef(2)}
Knee ${getRef(3)}
Ankle ${getRef(4)}

Pathological reflex:
Babinski ${getPatho(0)}
Hoffman ${getPatho(1)}
Snouting ${getPatho(2)}
Rooting ${getPatho(3)}
Palmo-mental ${getPatho(4)}
Grasping ${grasping}
`;

    document.getElementById('export-area').value = text;
}


// ===== start =====
init();

</script>

</body>
</html>
